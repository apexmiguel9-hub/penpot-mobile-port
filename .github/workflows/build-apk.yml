name: Build Penpot Mobile APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: >-
          remote = WebView abre el Penpot alojado (sin CORS, gestos vía shim);
          local = bundle parcheado empaquetado (requiere backend propio con CORS).
        type: choice
        options:
          - remote
          - local
        default: remote
      backend_uri:
        description: Backend de Penpot que usa la app (remote=server.url; local=window.penpotPublicURI + CORS para https://localhost)
        type: string
        required: false
        default: "https://design.penpot.app"
      penpot_ref:
        description: Commit upstream de Penpot a construir (solo mode=local)
        type: string
        required: false
        default: "fe89e9e52c1af7c80bfef7d389accb64d020328b"

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      MODE: ${{ inputs.mode || 'remote' }}
      PENPOT_SHA: ${{ inputs.penpot_ref || 'fe89e9e52c1af7c80bfef7d389accb64d020328b' }}
      BACKEND_URI: ${{ inputs.backend_uri || 'https://design.penpot.app' }}

    steps:
      # ── Toolchain setup ────────────────────────────────────────────────
      - name: Checkout this repo
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # Capacitor 7 requires JDK 21 (Gradle templates compile with
      # source/targetCompatibility = VERSION_21); JDK 17 fails with
      # "invalid source release: 21".
      - name: Setup JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # ── LOCAL MODE ONLY: pin Penpot source + apply the gesture patch ──
      - name: Fetch pinned Penpot commit
        if: ${{ env.MODE == 'local' }}
        run: |
          git init -q penpot
          git -C penpot remote add origin https://github.com/penpot/penpot.git
          git -C penpot fetch --depth 1 origin "$PENPOT_SHA"
          git -C penpot -c advice.detachedHead=false checkout "$PENPOT_SHA"
          echo "penpot source: $(git -C penpot rev-parse --short HEAD)"

      - name: Apply mobile-gestures patch
        if: ${{ env.MODE == 'local' }}
        run: ./patches/apply.sh penpot

      # ── LOCAL MODE ONLY: build the patched frontend bundle (devenv) ───
      - name: Restore devenv caches
        if: ${{ env.MODE == 'local' }}
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/penpot-home
          key: penpot-cache-${{ runner.os }}-${{ hashFiles('penpot/frontend/deps.edn', 'penpot/frontend/pnpm-lock.yaml', 'penpot/render-wasm/pnpm-lock.yaml', 'penpot/render-wasm/Cargo.lock') }}
          restore-keys: |
            penpot-cache-${{ runner.os }}-

      - name: Pre-create devenv home for caches
        if: ${{ env.MODE == 'local' }}
        run: mkdir -p "$RUNNER_TEMP/penpot-home"

      - name: Build Penpot frontend (devenv)
        if: ${{ env.MODE == 'local' }}
        run: |
          docker run --rm \
            --mount "source=${GITHUB_WORKSPACE}/penpot,type=bind,target=/home/penpot/penpot" \
            --mount "source=${RUNNER_TEMP}/penpot-home,type=bind,target=/home/penpot" \
            -e EXTERNAL_UID="$(id -u)" \
            -e BUILD_WASM=yes \
            -e JAVA_OPTS="-Xmx4096m" \
            -w /home/penpot/penpot/frontend \
            penpotapp/devenv:latest \
            sudo -EH -u penpot ./scripts/build ci

      - name: Save devenv caches (even on failure)
        if: ${{ env.MODE == 'local' && always() }}
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/penpot-home
          key: penpot-cache-${{ runner.os }}-${{ hashFiles('penpot/frontend/deps.edn', 'penpot/frontend/pnpm-lock.yaml', 'penpot/render-wasm/pnpm-lock.yaml', 'penpot/render-wasm/Cargo.lock') }}

      - name: Verify frontend bundle
        if: ${{ env.MODE == 'local' }}
        run: |
          test -f penpot/frontend/target/dist/index.html || { echo "index.html missing"; exit 1; }
          test -f penpot/frontend/target/dist/js/render-wasm.wasm || { echo "render-wasm.wasm missing"; exit 1; }
          echo "bundle ok: $(du -sh penpot/frontend/target/dist | cut -f1)"

      # ── LOCAL MODE ONLY: www from bundle + backend config ──────────────
      - name: Package www from bundle + backend config
        if: ${{ env.MODE == 'local' }}
        run: node scripts/package-www.mjs penpot/frontend/target/dist "$BACKEND_URI"

      # ── Capacitor config per mode ──────────────────────────────────────
      - name: Configure Capacitor (mode/server)
        run: node scripts/patch-capacitor-config.mjs "$MODE" "$BACKEND_URI"

      # ── Android project + APK ──────────────────────────────────────────
      - name: Install Capacitor dependencies
        run: npm install --no-audit --no-fund

      - name: Add Android platform
        run: |
          npx cap add android
          npx cap sync android

      - name: Inject touch shim into MainActivity (remote mode)
        if: ${{ env.MODE == 'remote' }}
        run: node scripts/patch-main-activity.mjs "$MODE"

      - name: Patch AndroidManifest permissions
        run: node scripts/patch-android-manifest.mjs

      - name: Pin deterministic debug signing
        run: node scripts/patch-gradle-signing.mjs

      - name: Install deterministic debug keystore
        run: |
          mkdir -p "$HOME/.android"
          cp "$GITHUB_WORKSPACE/android-keys/debug.keystore" "$HOME/.android/debug.keystore"
          ls -l "$HOME/.android/debug.keystore"

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: penpot-mobile-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload web bundle (inspection, local mode)
        if: ${{ env.MODE == 'local' }}
        uses: actions/upload-artifact@v4
        with:
          name: penpot-www
          path: www
          retention-days: 7

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## Penpot Mobile APK build"
            echo ""
            echo "- Mode        : \`${{ env.MODE }}\` (remote=hosted+shim · local=patched bundle)"
            echo "- Backend URI : \`${{ env.BACKEND_URI }}\`"
            if [ "${{ env.MODE }}" = "local" ]; then
              echo "- Penpot source: \`${{ env.PENPOT_SHA }}\`"
            fi
            echo "- Artifacts   : penpot-mobile-debug"
          } >> "$GITHUB_STEP_SUMMARY"